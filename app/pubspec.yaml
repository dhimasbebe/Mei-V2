name: mei_v
description: "Mei-V — Aplikasi Pemeliharaan Alat (Telkom Property Surabaya Utara). Flutter mobile + web dashboard, backend Laravel."
publish_to: "none"
version: 2.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Tahap 3 WS P (T10) — kerangka multi-bahasa ID/EN: delegate Material/
  # Widgets/Cupertino lokal untuk `Locale('id')` & `Locale('en')`.
  # Catatan: paket SDK ini mem-pin `intl` (lihat komentar di bawah), jadi
  # batas `intl` diikuti agar `pub get` tetap resolve.
  flutter_localizations:
    sdk: flutter

  # State management & routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Networking
  dio: ^5.7.0
  connectivity_plus: ^6.0.3

  # Penyimpanan lokal
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # Fitur perangkat
  mobile_scanner: ^5.2.3

  # Dashboard
  fl_chart: ^0.69.0

  # Utilitas
  # Dinaikkan 0.19.0 -> 0.20.2 oleh T10 (WS P): `flutter_localizations`
  # mem-pin `intl: 0.20.2` sehingga 0.19 tidak lagi dapat di-resolve.
  # Pemakaian di repo hanya `DateFormat('yyyy-MM-dd ...')` — stabil di 0.20.
  intl: ^0.20.2

  cupertino_icons: ^1.0.8

  # ---------------------------------------------------------------------
  # Fitur Tahap 3 — DISETUJUI pengguna (docs/DESIGN-FEATURES-V3.md §6).
  # PENTING: setelah mengubah berkas ini, jalankan `flutter pub get` di
  # terminal Anda. Sandbox pengembangan tidak dapat menjalankannya.
  #   image_picker             : [C] ambil kamera/galeri
  #   path_provider            : [A,C] direktori dokumen app (foto offline tahan tutup)
  #   flutter_image_compress   : [C] JPEG native (jalur utama kompresi)
  #   flutter_local_notifications + timezone : [B] notifikasi OS (dipakai T05)
  # ---------------------------------------------------------------------
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  flutter_image_compress: ^2.3.0
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4

  # ---------------------------------------------------------------------
  # Fitur Ekspor/Impor (WS L/M/N/O — T09), DISETUJUI pengguna.
  #   share_plus  : [O] bagikan tautan + berkas PDF lewat sheet OS
  #   file_picker : [M] pilih berkas CSV saat impor massal alat
  # Catatan deviasi DESIGN §C.3/T09 ("pubspec tidak bertambah paket"):
  # kedua paket disetujui pengguna SETELAH dokumen itu ditulis, sehingga
  # AC-L6 dibaca sebagai "tidak ada paket baru di luar yang disetujui".
  # ---------------------------------------------------------------------
  share_plus: ^10.1.4
  file_picker: ^8.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# Catatan arsitektur:
# - Model TIDAK memakai json_serializable/build_runner. fromJson/toJson ditulis
#   manual (lib/domain/models/*.dart) supaya tidak ada langkah codegen yang bisa
#   gagal di CI dan tidak ada file .g.dart yang perlu di-generate.
# - Hive (offline draft, P1/T12) belum dimasukkan agar P0 tidak menambah
#   dependensi; tambahkan saat mengerjakan T12.
# - Fitur Tahap 3 (docs/DESIGN-FEATURES-V3.md §6): antrean offline memakai
#   shared_preferences (satu string JSON), TIDAK memakai hive.
# - Seluruh paket Fitur Tahap 3 sudah DISETUJUI pengguna dan terpasang:
#       image_picker, path_provider, flutter_local_notifications, timezone,
#       flutter_image_compress, share_plus, file_picker.
#   Setiap fitur terkait tetap dirancang jalur ganda (lihat §5.2) supaya web
#   dan perangkat tanpa plugin tidak gagal total.

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/logos/
